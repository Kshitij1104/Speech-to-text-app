# Render Blueprint: New -> Blueprint -> pick this repo.
# NOTE: Whisper "base" needs ~1 GB RAM. Render's free web tier (512 MB) is too small;
# use the "starter" plan, or set WHISPER_MODEL=tiny to try on less memory.
services:
  - type: web
    name: speech-to-text
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: WHISPER_MODEL
        value: base
      - key: DATABASE_URL
        fromDatabase:
          name: s2t-db
          property: connectionString

databases:
  - name: s2t-db
    plan: free
