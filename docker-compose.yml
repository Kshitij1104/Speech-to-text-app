services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: s2t
      POSTGRES_PASSWORD: s2t
      POSTGRES_DB: s2t
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U s2t"]
      interval: 5s
      retries: 10

  web:
    build:
      context: .
      args:
        WHISPER_MODEL: base
    environment:
      DATABASE_URL: postgresql://s2t:s2t@db:5432/s2t
      WHISPER_MODEL: base
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
